name: Aggiorna dati GPS

on:
  schedule:
    # Esecuzione automatica ogni ora (orario UTC).
    - cron: '0 * * * *'

  workflow_dispatch:

concurrency:
  group: aggiorna-gps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installa strumenti PDF ed Excel
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-ita

          python -m pip install --upgrade pip
          pip install pdfplumber openpyxl

      - name: Prepara cartella temporanea
        run: |
          mkdir -p "$RUNNER_TEMP/bollettini-gps"

      - name: Cerca e scarica i bollettini dagli USP
        run: |
          python tools/gps/scarica_bollettini.py \
            --cartella "$RUNNER_TEMP/bollettini-gps"

      - name: Elabora i bollettini e aggiorna le statistiche
        run: |
          CARTELLA="$RUNNER_TEMP/bollettini-gps"

          if find "$CARTELLA" -type f \
            \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.xlsm' \) \
            -print -quit | grep -q .; then

            python tools/gps/build_gps_data.py \
              --cartella "$CARTELLA" \
              --output assets/gps_data.json \
              --aggiungi || true

          else
            echo "Nessun nuovo bollettino GPS scaricato."
          fi

      - name: Elimina i file temporanei
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/bollettini-gps"

      - name: Salva i dati aggregati nel repository
        run: |
          git add assets/gps_data.json
          git add tools/gps/bollettini_visti.json
          git add -A tools/gps/bollettini_problemi.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati GPS."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git commit -m "Aggiornamento automatico dati GPS"
          git push
